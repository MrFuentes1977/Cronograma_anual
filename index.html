<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Gestión de Actividades</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f4f4f4; }
    header {
      background:#007BFF; color:white; text-align:center; padding:10px; position:relative;
    }
    header h1 { margin:0; font-size:1.5em; }
    .nav-btn {
      position:absolute; top:10px; background:none; border:none; color:white;
      font-size:1.5em; cursor:pointer;
    }
    #prev { left:10px; }
    #next { right:10px; }
    #calendar {
      display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:#ccc; padding:5px;
    }
    .weekday {
      background:#eee; font-weight:bold; text-align:center; padding:5px;
    }
    .day {
      background:#fff; min-height:100px; border:1px solid #ccc; position:relative; padding:2px;
      cursor:pointer; overflow-y:auto;
    }
    .day.inactive { background:#f0f0f0; color:#aaa; }
    .day-number { font-weight:bold; font-size:0.9em; }
    
    /* MEJORA DE LEGIBILIDAD: Texto en negro y estilos de bloque */
    .activity-block {
      margin-top:2px; 
      padding:2px 5px; 
      font-size:0.75em; 
      color: #000 !important; /* Color de texto negro forzado */
      font-weight: 500;
      border-radius:3px;
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .activity-block span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-grow: 1;
    }

    .delete-activity {
      background: rgba(255,255,255,0.4); 
      border: 1px solid rgba(0,0,0,0.2); 
      color: #000; 
      cursor: pointer;
      font-weight: bold; 
      border-radius: 50%; 
      width: 14px; height: 14px;
      display: flex; align-items: center; justify-content: center; 
      font-size: 10px;
      margin-left: 4px;
      flex-shrink: 0;
    }
    .delete-activity:hover { background: #ff4d4d; color: white; }

    .btn-group { padding: 10px; text-align: center; }
    #addActivityBtn { padding:10px 20px; background:#007BFF; color:white; border:none; cursor:pointer; }
    #download { padding:10px 20px; background:green; color:white; border:none; cursor:pointer; }
    #downloadYear { padding:10px 20px; background:#17a2b8; color:white; border:none; cursor:pointer; }

    /* Modal */
    .modal {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index: 1000;
    }
    .modal-content {
      background:white; padding:20px; border-radius:5px; width:300px;
    }
    .modal-content input, .modal-content select {
      width:100%; margin-bottom:10px; padding:5px; box-sizing: border-box;
    }
    
    #export-area { display: none; }
  </style>
</head>
<body>
  <header>
    <button id="prev" class="nav-btn">◀</button>
    <h1 id="monthYear"></h1>
    <button id="next" class="nav-btn">▶</button>
  </header>

  <div class="btn-group">
    <button id="addActivityBtn">Agregar Actividad</button>
    <button id="download">Descargar Mes (PDF)</button>
    <button id="downloadYear">Descargar Año Completo (PDF)</button>
  </div>

  <div id="calendar-container">
    <div id="calendar"></div>
  </div>

  <div id="export-area"></div>

  <div id="activityModal" class="modal">
    <div class="modal-content">
      <h3>Nueva Actividad</h3>
      <input type="text" id="activityName" placeholder="Nombre de la actividad" required>
      <label>Fecha Inicio:</label>
      <input type="date" id="startDate" required>
      <label>Fecha Fin:</label>
      <input type="date" id="endDate" required>
      <label>Color de fondo:</label>
      <input type="color" id="activityColor" value="#a2c2e8">
      <div style="text-align:right;">
        <button id="saveActivity">Guardar</button>
        <button id="cancelActivity">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    const calendarEl = document.getElementById("calendar");
    const monthYearEl = document.getElementById("monthYear");
    let currentDate = new Date();
    const weekdays = ["L","M","X","J","V","S","D"];

    function getActivities() {
      return JSON.parse(localStorage.getItem("activities") || "[]");
    }
    function saveActivities(activities) {
      localStorage.setItem("activities", JSON.stringify(activities));
    }

    function deleteActivity(id, event) {
      event.stopPropagation();
      if(confirm("¿Deseas eliminar esta actividad por completo?")) {
        let activities = getActivities();
        activities = activities.filter(act => act.id !== id);
        saveActivities(activities);
        renderCalendar(currentDate);
      }
    }

    function renderCalendar(date, targetEl = calendarEl, isFullYearExport = false) {
      targetEl.innerHTML = "";
      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1);
      const startDay = (firstDay.getDay() + 6) % 7; 
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();

      if(isFullYearExport) {
        const title = document.createElement("h2");
        title.style.textAlign = "center";
        title.style.margin = "20px 0 10px 0";
        title.textContent = date.toLocaleDateString("es-ES",{month:"long",year:"numeric"}).toUpperCase();
        targetEl.appendChild(title);
        
        const grid = document.createElement("div");
        grid.style.display = "grid";
        grid.style.gridTemplateColumns = "repeat(7,1fr)";
        grid.style.gap = "1px";
        grid.style.background = "#ccc";
        targetEl.appendChild(grid);
        targetEl = grid; 
      } else {
        monthYearEl.textContent = date.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
      }

      weekdays.forEach(d=>{
        const wd=document.createElement("div");
        wd.className="weekday"; wd.textContent=d;
        targetEl.appendChild(wd);
      });

      for(let i=0;i<startDay;i++){
        const day=document.createElement("div");
        day.className="day inactive";
        day.innerHTML=`<div class="day-number">${prevMonthDays-startDay+i+1}</div>`;
        targetEl.appendChild(day);
      }

      const activities=getActivities();

      for(let d=1;d<=daysInMonth;d++){
        const dayDate = new Date(year, month, d);
        // Ajuste manual de zona horaria para evitar desfases en el input date
        const offset = dayDate.getTimezoneOffset();
        const adjustedDate = new Date(dayDate.getTime() - (offset*60*1000));
        const dateStr = adjustedDate.toISOString().split('T')[0];
        
        const day=document.createElement("div");
        day.className="day";
        day.innerHTML=`<div class="day-number">${d}</div>`;

        activities.forEach(act=>{
          if(dateStr >= act.startDate && dateStr <= act.endDate){
            const block=document.createElement("div");
            block.className="activity-block";
            block.style.backgroundColor = act.color;
            block.innerHTML = `<span>${act.name}</span>`;
            
            if(!isFullYearExport) {
              const delBtn = document.createElement("button");
              delBtn.className = "delete-activity";
              delBtn.textContent = "×";
              delBtn.onclick = (e) => deleteActivity(act.id, e);
              block.appendChild(delBtn);
            }
            
            day.appendChild(block);
          }
        });

        if(!isFullYearExport) day.addEventListener("click",()=>openModal(dateStr));
        targetEl.appendChild(day);
      }
    }

    const modal=document.getElementById("activityModal");
    const saveBtn=document.getElementById("saveActivity");
    const cancelBtn=document.getElementById("cancelActivity");

    function openModal(date){
      document.getElementById("startDate").value=date;
      document.getElementById("endDate").value=date;
      document.getElementById("activityName").value = "";
      modal.style.display="flex";
    }
    
    document.getElementById("addActivityBtn").onclick=()=>{ modal.style.display="flex"; };
    cancelBtn.onclick=()=>{ modal.style.display="none"; };

    saveBtn.onclick=()=>{
      const name=document.getElementById("activityName").value;
      const start=document.getElementById("startDate").value;
      const end=document.getElementById("endDate").value;
      const color=document.getElementById("activityColor").value;
      if(name && start && end){
        const activities=getActivities();
        activities.push({id: Date.now(), name, startDate:start, endDate:end, color});
        saveActivities(activities);
        modal.style.display="none";
        renderCalendar(currentDate);
      }
    };

    document.getElementById("prev").onclick=()=>{
      currentDate.setMonth(currentDate.getMonth()-1);
      renderCalendar(currentDate);
    };
    document.getElementById("next").onclick=()=>{
      currentDate.setMonth(currentDate.getMonth()+1);
      renderCalendar(currentDate);
    };

    document.getElementById("download").onclick=()=>{
      const element = document.getElementById("calendar-container");
      html2pdf().set({
        margin: 10,
        filename: `mes-${monthYearEl.textContent}.pdf`,
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      }).from(element).save();
    };

    document.getElementById("downloadYear").onclick= async function() {
      const exportArea = document.getElementById("export-area");
      exportArea.innerHTML = ""; 
      exportArea.style.display = "block";
      
      const year = currentDate.getFullYear();
      
      for (let m = 0; m < 12; m++) {
        const tempContainer = document.createElement("div");
        tempContainer.style.pageBreakAfter = "always";
        exportArea.appendChild(tempContainer);
        
        const tempDate = new Date(year, m, 1);
        renderCalendar(tempDate, tempContainer, true);
      }

      await html2pdf().set({
        margin: 5,
        filename: `calendario-anual-${year}.pdf`,
        html2canvas: { scale: 1.5 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      }).from(exportArea).save();
      
      exportArea.style.display = "none";
      exportArea.innerHTML = "";
    };

    renderCalendar(currentDate);
  </script>
</body>
</html>
