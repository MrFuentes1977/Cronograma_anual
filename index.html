<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calendario de Planificación Anual</title>

<!-- html2pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root {
  --blue: #4aa3df;
  --light: #f5f7fa;
  --border: #ddd;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: var(--light);
}

header {
  background: var(--blue);
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  margin: 0;
}

header button {
  background: white;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
  margin-left: 5px;
}

main {
  padding: 15px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.controls input, .controls button {
  padding: 8px;
  border-radius: 5px;
  border: 1px solid var(--border);
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: white;
  border: 1px solid var(--border);
}

.day-name, .day {
  border: 1px solid var(--border);
  min-height: 120px;
  padding: 5px;
}

.day-name {
  background: #eaf3fb;
  font-weight: bold;
  text-align: center;
}

.day-number {
  font-weight: bold;
  margin-bottom: 5px;
}

.activity {
  font-size: 12px;
  padding: 2px 5px;
  border-radius: 4px;
  margin-bottom: 3px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.activity span {
  cursor: pointer;
  font-weight: bold;
}

.pdf-buttons {
  margin-top: 15px;
  display: flex;
  gap: 10px;
}
</style>
</head>

<body>

<header>
  <div>
    <button onclick="changeMonth(-1)">◀</button>
    <button onclick="changeMonth(1)">▶</button>
  </div>
  <h2 id="title"></h2>
  <div>
    <button onclick="downloadCurrentMonth()">Descargar Mes Actual</button>
    <button onclick="downloadFullYear()">Descargar Calendario Completo</button>
  </div>
</header>

<main>

<div class="controls">
  <input type="text" id="name" placeholder="Actividad">
  <input type="date" id="start">
  <input type="date" id="end">
  <input type="color" id="color">
  <button onclick="addActivity()">Agregar</button>
</div>

<div id="calendar-container">
  <div class="calendar" id="calendar"></div>
</div>

</main>

<script>
let currentDate = new Date();
let activities = JSON.parse(localStorage.getItem("activities")) || [];

const days = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

function renderCalendar() {
  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  document.getElementById("title").innerText =
    currentDate.toLocaleDateString("es-ES",{month:"long",year:"numeric"});

  days.forEach(d => {
    calendar.innerHTML += `<div class="day-name">${d}</div>`;
  });

  const firstDay = new Date(year, month, 1);
  let startIndex = (firstDay.getDay() + 6) % 7;
  const totalDays = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < startIndex; i++) {
    calendar.innerHTML += `<div class="day"></div>`;
  }

  for (let day = 1; day <= totalDays; day++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const dayBox = document.createElement("div");
    dayBox.className = "day";
    dayBox.innerHTML = `<div class="day-number">${day}</div>`;

    activities.forEach(act => {
      if (dateStr >= act.start && dateStr <= act.end) {
        const div = document.createElement("div");
        div.className = "activity";
        div.style.background = act.color;
        div.innerHTML = `${act.name}<span onclick="removeActivity('${act.id}')">✖</span>`;
        dayBox.appendChild(div);
      }
    });

    calendar.appendChild(dayBox);
  }
}

function changeMonth(delta) {
  currentDate.setMonth(currentDate.getMonth() + delta);
  renderCalendar();
}

function addActivity() {
  const name = nameInput.value;
  const start = startInput.value;
  const end = endInput.value;
  const color = colorInput.value;

  if (!name || !start || !end) return alert("Completa todos los campos");

  activities.push({
    id: crypto.randomUUID(),
    name, start, end, color
  });

  localStorage.setItem("activities", JSON.stringify(activities));
  renderCalendar();
}

function removeActivity(id) {
  if (!confirm("¿Eliminar esta actividad en todo el calendario?")) return;
  activities = activities.filter(a => a.id !== id);
  localStorage.setItem("activities", JSON.stringify(activities));
  renderCalendar();
}

function downloadCurrentMonth() {
  html2pdf().from(document.getElementById("calendar-container"))
    .set({ filename: "mes_actual.pdf", html2canvas:{scale:2} })
    .save();
}

function downloadFullYear() {
  const container = document.createElement("div");

  const originalMonth = currentDate.getMonth();
  for (let m = 0; m < 12; m++) {
    currentDate.setMonth(m);
    renderCalendar();
    container.appendChild(document.getElementById("calendar-container").cloneNode(true));
  }
  currentDate.setMonth(originalMonth);
  renderCalendar();

  html2pdf().from(container)
    .set({ filename: "calendario_anual.pdf", pagebreak:{mode:"after"} })
    .save();
}

const nameInput = document.getElementById("name");
const startInput = document.getElementById("start");
const endInput = document.getElementById("end");
const colorInput = document.getElementById("color");

renderCalendar();
</script>

</body>
</html>
