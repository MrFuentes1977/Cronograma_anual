<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Gestión de Actividades</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f4f4f4; }
    header {
      background:#007BFF; color:white; text-align:center; padding:10px; position:relative;
    }
    header h1 { margin:0; font-size:1.5em; }
    .nav-btn {
      position:absolute; top:10px; background:none; border:none; color:white;
      font-size:1.5em; cursor:pointer;
    }
    #prev { left:10px; }
    #next { right:10px; }
    #calendar {
      display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:#ccc; padding:5px;
    }
    .weekday {
      background:#eee; font-weight:bold; text-align:center; padding:5px;
    }
    .day {
      background:#fff; min-height:100px; border:1px solid #ccc; position:relative; padding:2px;
      cursor:pointer; overflow-y:auto;
    }
    .day.inactive { background:#f0f0f0; color:#aaa; }
    .day-number { font-weight:bold; font-size:0.9em; }
    .activity-block {
      margin-top:2px; padding:2px; font-size:0.8em; color:#fff; border-radius:3px;
    }
    #addActivityBtn {
      margin:10px; padding:10px 20px; background:#007BFF; color:white; border:none; cursor:pointer;
    }
    #download {
      margin:10px; padding:10px 20px; background:green; color:white; border:none; cursor:pointer;
    }
    /* Modal */
    .modal {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.5); justify-content:center; align-items:center;
    }
    .modal-content {
      background:white; padding:20px; border-radius:5px; width:300px;
    }
    .modal-content input, .modal-content select {
      width:100%; margin-bottom:10px; padding:5px;
    }
    .modal-content button { margin-right:5px; }
  </style>
</head>
<body>
  <header>
    <button id="prev" class="nav-btn">◀</button>
    <h1 id="monthYear"></h1>
    <button id="next" class="nav-btn">▶</button>
  </header>

  <button id="addActivityBtn">Agregar Actividad</button>
  <div id="calendar"></div>
  <button id="download">Download as PDF</button>

  <!-- Modal -->
  <div id="activityModal" class="modal">
    <div class="modal-content">
      <h3>Nueva Actividad</h3>
      <input type="text" id="activityName" placeholder="Nombre de la actividad" required>
      <label>Fecha Inicio:</label>
      <input type="date" id="startDate" required>
      <label>Fecha Fin:</label>
      <input type="date" id="endDate" required>
      <label>Color:</label>
      <input type="color" id="activityColor" value="#007BFF">
      <div style="text-align:right;">
        <button id="saveActivity">Guardar</button>
        <button id="cancelActivity">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    const calendarEl = document.getElementById("calendar");
    const monthYearEl = document.getElementById("monthYear");
    let currentDate = new Date();
    const weekdays = ["L","M","X","J","V","S","D"];

    // Recuperar actividades de localStorage
    function getActivities() {
      return JSON.parse(localStorage.getItem("activities") || "[]");
    }
    function saveActivities(activities) {
      localStorage.setItem("activities", JSON.stringify(activities));
    }

    // Renderizar calendario
    function renderCalendar(date) {
      calendarEl.innerHTML = "";
      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1);
      const startDay = (firstDay.getDay() + 6) % 7; // lunes=0
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();

      monthYearEl.textContent = date.toLocaleDateString("es-ES",{month:"long",year:"numeric"});

      weekdays.forEach(d=>{
        const wd=document.createElement("div");
        wd.className="weekday"; wd.textContent=d;
        calendarEl.appendChild(wd);
      });

      // días previos
      for(let i=0;i<startDay;i++){
        const day=document.createElement("div");
        day.className="day inactive";
        day.innerHTML=`<div class="day-number">${prevMonthDays-startDay+i+1}</div>`;
        calendarEl.appendChild(day);
      }

      const activities=getActivities();

      // días del mes
      for(let d=1;d<=daysInMonth;d++){
        const fullDate=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const day=document.createElement("div");
        day.className="day";
        day.innerHTML=`<div class="day-number">${d}</div>`;

        // Mostrar actividades que caen en este día
        activities.forEach(act=>{
          const start=new Date(act.startDate);
          const end=new Date(act.endDate);
          const current=new Date(fullDate);
          if(current>=start && current<=end){
            const block=document.createElement("div");
            block.className="activity-block";
            block.style.background=act.color;
            block.textContent=act.name;
            day.appendChild(block);
          }
        });

        day.addEventListener("click",()=>openModal(fullDate));
        calendarEl.appendChild(day);
      }

      // días siguientes
      const totalCells=startDay+daysInMonth;
      const nextDays=(7-(totalCells%7))%7;
      for(let i=1;i<=nextDays;i++){
        const day=document.createElement("div");
        day.className="day inactive";
        day.innerHTML=`<div class="day-number">${i}</div>`;
        calendarEl.appendChild(day);
      }
    }

    // Modal
    const modal=document.getElementById("activityModal");
    const addBtn=document.getElementById("addActivityBtn");
    const saveBtn=document.getElementById("saveActivity");
    const cancelBtn=document.getElementById("cancelActivity");

    let selectedDate=null;

    function openModal(date){
      selectedDate=date;
      document.getElementById("startDate").value=date;
      document.getElementById("endDate").value=date;
      modal.style.display="flex";
    }
    addBtn.onclick=()=>{selectedDate=null; modal.style.display="flex";};
    cancelBtn.onclick=()=>{modal.style.display="none";};

    saveBtn.onclick=()=>{
      const name=document.getElementById("activityName").value;
      const start=document.getElementById("startDate").value;
      const end=document.getElementById("endDate").value;
      const color=document.getElementById("activityColor").value;
      if(name && start && end){
        const activities=getActivities();
        activities.push({name,startDate:start,endDate:end,color});
        saveActivities(activities);
        modal.style.display="none";
        renderCalendar(currentDate);
      }
    };

    // Navegación
    document.getElementById("prev").onclick=()=>{
      currentDate.setMonth(currentDate.getMonth()-1);
      renderCalendar(currentDate);
    };
    document.getElementById("next").onclick=()=>{
      currentDate.setMonth(currentDate.getMonth()+1);
      renderCalendar(currentDate);
    };

    // Exportar PDF
    document.getElementById("download").onclick=()=>{
      html2pdf().set({margin:0.5,filename:"calendario.pdf",html2canvas:{scale:2}})
        .from(document.body).save();
    };

    renderCalendar(currentDate);
  </script>
</body>
</html>
