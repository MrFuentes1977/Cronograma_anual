<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador Pro 2026 - Texto Completo</title>
  <style>
    :root { --cell-height: 110px; } 

    body { font-family: 'Segoe UI', Arial, sans-serif; margin:0; background:#f4f4f4; color: #333; }
    
    header { background:#007BFF; color:white; text-align:center; padding:15px; position:relative; }
    .nav-btn { position:absolute; top:15px; background:rgba(255,255,255,0.2); border:none; color:white; font-size:1.2em; cursor:pointer; border-radius: 4px; padding: 5px 12px; }
    #prev { left:15px; }
    #next { right:15px; }
    
    .controls { padding: 15px; background: white; border-bottom: 1px solid #ddd; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
    .slider-container { display: flex; align-items: center; gap: 8px; background: #f8f9fa; padding: 5px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.85em; }

    button { transition: all 0.2s; border-radius: 4px; font-weight: bold; cursor: pointer; padding: 10px 14px; border: none; font-size: 0.85em; }
    #addActivityBtn { background:#007BFF; color:white; }
    .btn-pdf { background:#28a745; color:white; }
    .btn-backup { background: #6c757d; color: white; }

    /* ÁREA DE IMPRESIÓN PROFESIONAL */
    #print-area { background: white; margin: 10px auto; width: 100%; max-width: 1100px; padding: 20px; box-sizing: border-box; }
    #pdfTitle { text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; color: #000; }
    
    #calendar { display:grid; grid-template-columns:repeat(7,1fr); background: #000; border: 1.5px solid #000; gap: 1.5px; }
    .weekday { background:#e9ecef; font-weight:bold; text-align:center; padding:10px; font-size: 0.9em; }
    
    .day { background:#fff; min-height: var(--cell-height); position:relative; padding:4px; display: flex; flex-direction: column; cursor: pointer; }
    .day.inactive { background: #fff; }
    .day-number { font-weight:bold; font-size:1.1em; margin-bottom: 4px; color: #000; }
    
    /* MEJORA: TEXTO COMPLETO Y MULTILÍNEA */
    .activity-block { 
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 3px 5px; 
        font-size: 0.68em; /* Un poco más pequeña para ganar espacio */
        color: #000 !important; 
        font-weight: 700; 
        border-radius: 2px; 
        margin-bottom: 3px; 
        border: 0.5px solid rgba(0,0,0,0.3); 
        line-height: 1.1;
    }
    .activity-text { 
        word-wrap: break-word; 
        overflow-wrap: break-word; 
        white-space: normal; /* Permite saltos de línea */
        flex-grow: 1; 
        text-align: left;
    }
    .delete-btn { color: #dc3545; font-weight: bold; margin-left: 4px; cursor: pointer; font-size: 1.2em; line-height: 1; flex-shrink: 0; }

    @media print {
        .nav-btn, .controls, header, .delete-btn { display: none !important; }
        #print-area { padding: 0; width: 100%; max-width: none; }
        .day { min-height: 135px !important; }
        .activity-block { border: 0.3px solid #000; }
    }

    /* Modales */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index: 1000; }
    .modal-content { background:white; padding:25px; border-radius:12px; width:320px; }
    .modal-content label { display: block; font-size: 0.9em; font-weight: bold; margin-top: 10px; }
    .modal-content input { width:100%; padding:10px; margin-top:5px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
  </style>
</head>
<body>

  <header>
    <button id="prev" class="nav-btn">◀ Anterior</button>
    <h1 id="uiHeader">Planificador Profesional</h1>
    <button id="next" class="nav-btn">Siguiente ▶</button>
  </header>

  <div class="controls">
    <div class="slider-container">
      <label>📏 Altura Celda:</label>
      <input type="range" id="heightSlider" min="80" max="220" value="110">
    </div>
    <button id="addActivityBtn">＋ Nueva Actividad</button>
    <button class="btn-pdf" onclick="exportPDF('month')">📄 PDF Mes</button>
    <button class="btn-pdf" onclick="exportPDF('year')" style="background:#157347">🗓️ PDF Año Completo</button>
    <button class="btn-backup" onclick="exportData()">💾 Exportar .JSON</button>
    <button class="btn-backup" onclick="document.getElementById('importInput').click()">📂 Importar .JSON</button>
    <input type="file" id="importInput" style="display:none" accept=".json" onchange="importData(event)">
  </div>

  <div id="print-area">
    <div id="pdfTitle"></div>
    <div id="calendar"></div>
  </div>

  <div id="activityModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-top:0">Actividad</h3>
      <input type="hidden" id="editIndex" value="-1">
      <label>Nombre Actividad:</label><input type="text" id="activityName" placeholder="Ej: Elecciones Gobierno Escolar">
      <label>Inicio:</label><input type="date" id="startDate">
      <label>Fin:</label><input type="date" id="endDate">
      <label>Color Fondo:</label><input type="color" id="activityColor" value="#ffffff">
      <button id="saveActivity" style="width:100%; background:#007BFF; color:white; margin-top:15px; padding:12px;">Guardar Cambios</button>
      <button onclick="closeModal()" style="width:100%; background:none; color:gray; margin-top:5px;">Cancelar</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    let activities = JSON.parse(localStorage.getItem("calendar_acts")) || [];
    let currentDate = new Date(2026, 0, 1);

    document.getElementById("heightSlider").addEventListener("input", (e) => {
      document.documentElement.style.setProperty('--cell-height', e.target.value + 'px');
    });

    function render(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const monthLabel = date.toLocaleDateString("es-ES", {month:"long", year:"numeric"});
      document.getElementById("pdfTitle").textContent = monthLabel;
      const cal = document.getElementById("calendar");
      cal.innerHTML = "";

      ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"].forEach(d => {
        const h = document.createElement("div"); h.className = "weekday"; h.textContent = d.substring(0,2); cal.appendChild(h);
      });

      const firstDay = new Date(year, month, 1);
      const startDay = (firstDay.getDay() + 6) % 7; 
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for(let i=0; i<startDay; i++) cal.appendChild(Object.assign(document.createElement("div"), {className: "day inactive"}));

      for(let d=1; d<=daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayDiv = document.createElement("div");
        dayDiv.className = "day";
        dayDiv.innerHTML = `<span class="day-number">${d}</span>`;
        
        dayDiv.onclick = (e) => { if(e.target === dayDiv || e.target.className === 'day-number') openModal(-1, dateStr); };

        activities.forEach((a, index) => {
          if(dateStr >= a.start && dateStr <= a.end) {
            const act = document.createElement("div");
            act.className = "activity-block";
            act.style.backgroundColor = a.color;
            
            const txt = document.createElement("span");
            txt.className = "activity-text";
            txt.textContent = a.name;
            txt.onclick = (e) => { e.stopPropagation(); openModal(index); };
            
            const del = document.createElement("span");
            del.className = "delete-btn";
            del.innerHTML = "&times;";
            del.onclick = (e) => { e.stopPropagation(); deleteActivity(index); };
            
            act.appendChild(txt);
            act.appendChild(del);
            dayDiv.appendChild(act);
          }
        });
        cal.appendChild(dayDiv);
      }
      
      const totalCells = Math.ceil((startDay + daysInMonth) / 7) * 7;
      for(let i=0; i < (totalCells - (startDay + daysInMonth)); i++) cal.appendChild(Object.assign(document.createElement("div"), {className: "day inactive"}));
    }

    function openModal(index = -1, date = null) {
      const modal = document.getElementById("activityModal");
      const idxInput = document.getElementById("editIndex");
      if(index > -1) {
        const a = activities[index];
        document.getElementById("activityName").value = a.name;
        document.getElementById("startDate").value = a.start;
        document.getElementById("endDate").value = a.end;
        document.getElementById("activityColor").value = a.color;
        idxInput.value = index;
      } else {
        document.getElementById("activityName").value = "";
        document.getElementById("startDate").value = date || "";
        document.getElementById("endDate").value = date || "";
        document.getElementById("activityColor").value = "#ffffff";
        idxInput.value = -1;
      }
      modal.style.display = "flex";
    }

    function closeModal() { document.getElementById("activityModal").style.display = "none"; }

    function deleteActivity(index) {
      if(confirm("¿Eliminar actividad?")) { activities.splice(index, 1); saveAndRender(); }
    }

    document.getElementById("saveActivity").onclick = () => {
      const name = document.getElementById("activityName").value;
      const index = parseInt(document.getElementById("editIndex").value);
      const data = {
        name: name, start: document.getElementById("startDate").value,
        end: document.getElementById("endDate").value, color: document.getElementById("activityColor").value
      };
      if(!name) return;
      if(index > -1) activities[index] = data;
      else activities.push(data);
      saveAndRender(); closeModal();
    };

    function saveAndRender() { localStorage.setItem("calendar_acts", JSON.stringify(activities)); render(currentDate); }

    async function exportPDF(type) {
      const element = document.getElementById("print-area");
      const originalDate = new Date(currentDate);
      const opt = {
        margin: 10, filename: type === 'year' ? 'Plan_Completo_2026.pdf' : `Mes_${document.getElementById("pdfTitle").textContent}.pdf`,
        image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'letter', orientation: 'landscape' }
      };

      if (type === 'month') {
        render(currentDate);
        html2pdf().set(opt).from(element).save();
      } else {
        const doc = html2pdf().set(opt).from(element).toPdf();
        for (let i = 0; i < 12; i++) {
          render(new Date(2026, i, 1));
          await new Promise(r => setTimeout(r, 500)); // Espera extra para asegurar el ajuste de texto
          if (i > 0) await doc.get('pdf').then(pdf => pdf.addPage());
          await doc.toCanvas().toImg().toPdf();
        }
        doc.save();
      }
      setTimeout(() => render(originalDate), 1000);
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activities));
      const a = document.createElement('a'); a.href = dataStr; a.download = "respaldo.json"; a.click();
    }

    function importData(event) {
      const reader = new FileReader();
      reader.onload = (e) => { activities = JSON.parse(e.target.result); saveAndRender(); };
      reader.readAsText(event.target.files[0]);
    }

    document.getElementById("prev").onclick = () => { currentDate.setMonth(currentDate.getMonth()-1); render(currentDate); };
    document.getElementById("next").onclick = () => { currentDate.setMonth(currentDate.getMonth()+1); render(currentDate); };
    document.getElementById("addActivityBtn").onclick = () => openModal();

    render(currentDate);
  </script>
</body>
</html>
